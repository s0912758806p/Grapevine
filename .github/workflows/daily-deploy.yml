name: Daily Safe Deploy

# Guarantees at least one deploy per day with a real file change, while never
# breaking the live site:
#   1. Regenerate public/build-info.json  -> the daily file change
#   2. npm run build                      -> HARD GATE; if it fails the job
#                                            aborts here and NOTHING is pushed,
#                                            so production stays untouched.
#   3. Commit + push to dev               -> only runs if the build passed,
#                                            triggering the existing
#                                            dev -> release -> main -> Vercel
#                                            auto-deploy cascade (Auto-deploy.yml).

on:
  schedule:
    # 00:17 UTC daily (~08:17 Asia/Taipei). Off-the-hour to dodge GH cron congestion.
    - cron: "17 0 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Never let two daily runs overlap.
concurrency:
  group: daily-safe-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          # PAT so the resulting push re-triggers Auto-deploy.yml (the default
          # GITHUB_TOKEN intentionally does NOT trigger downstream workflows).
          token: ${{ secrets.BOT_PAT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update build info (the daily file change)
        run: npm run build:info

      - name: Build (HARD GATE — must pass or we abort, leaving prod untouched)
        run: npm run build

      - name: Commit & push to dev (only reached when the build passed)
        run: |
          git config user.name "grapevine-bot"
          git config user.email "grapevine-bot@users.noreply.github.com"
          git add public/build-info.json
          if git diff --cached --quiet; then
            echo "No build-info changes to commit; skipping."
            exit 0
          fi
          git commit -m "chore: daily safe deploy — build-info $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin dev
