name: Auto Deploy (dev -> production)

# PAT-free replacement for the old PR cascade, which broke when BOT_PAT_TOKEN
# expired (checkout failed: "could not read Username for 'https://github.com'").
#
# On every push to dev: build as a HARD GATE, then — only if it passes —
# fast-forward release and main. Vercel deploys main via its own GitHub App
# webhook, and only swaps the live site if ITS build also succeeds (atomic).
# Code that fails to build never reaches production.
#
# Uses the built-in GITHUB_TOKEN (repo Actions perms are read-write, no branch
# protection), so there is no PAT to expire. These pushes don't re-trigger
# workflows, so there is no recursion.

on:
  push:
    branches:
      - dev
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-deploy
  cancel-in-progress: false

jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (HARD GATE — must pass before anything reaches production)
        run: npm run build

      - name: Promote dev -> release -> main and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release sync is best-effort; main is the production deploy.
          git push origin HEAD:release || echo "release not fast-forward; sync skipped"
          git push origin HEAD:main
          echo "Pushed to main — Vercel will deploy via its webhook."
